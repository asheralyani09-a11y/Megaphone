name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Select Xcode Version
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    - name: Build and Package IPA
      run: |
        xcodebuild archive -project Megaphone.xcodeproj -scheme Megaphone -archivePath $PWD/build/Megaphone.xcarchive CODE_SIGNING_ALLOWED=NO
        mkdir -p build/Payload
        cp -r build/Megaphone.xcarchive/Products/Applications/*.app build/Payload/
        cd build
        zip -r Megaphone.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Megaphone-IPA
        path: build/Megaphone.ipa
