name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1.6.0
      with:
        xcode-version: latest-stable

    - name: Build IPA
      run: |
        xcodebuild -workspace Megaphone.xcworkspace -scheme Megaphone -sdk iphoneos -configuration Release archive -archivePath $PWD/build/Megaphone.xcarchive
        xcodebuild -exportArchive -archivePath $PWD/build/Megaphone.xcarchive -exportOptionsPlist Megaphone/Info.plist -exportPath $PWD/build/output || true

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Megaphone-IPA
        path: build/
