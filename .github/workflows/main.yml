name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build App for Simulator
      run: |
        xcodebuild -project Megaphone.xcodeproj -scheme Megaphone -sdk iphonesimulator -configuration Release CODE_SIGNING_ALLOWED=NO build

    - name: Create IPA Package
      run: |
        mkdir -p build/Payload
        find build -name "*.app" -exec cp -r {} build/Payload/ \; || find . -name "*.app" -exec cp -r {} build/Payload/ \;
        cd build
        zip -r Megaphone.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Megaphone-IPA
        path: build/Megaphone.ipa
